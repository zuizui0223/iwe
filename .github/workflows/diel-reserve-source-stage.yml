name: Pinned diel reproductive source staging
on:
  push:
    branches: [analysis/diel-functional-reserve-meta-20261114]
    paths: [.github/workflows/diel-reserve-source-stage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage author-published reproducibility data with exact blob identities
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,csv,io
          from pathlib import Path
          out=Path('staging');out.mkdir()
          files={'author.csv':('DvN_LiteratureDataClean_2024-09-13.csv','39a82d966afcdde670603add1c881ace8791ffe9'),'traits.csv':('SppTraitData_clean.csv','18381e550a7e405fe4f198909f0bb381bbecf1e0')}
          audit={}
          for target,(name,expected) in files.items():
              url='https://raw.githubusercontent.com/liamkendall/bumble-bat/main/data/'+name
              raw=urllib.request.urlopen(url,timeout=40).read(3000000)
              blob=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              assert blob==expected,(name,blob)
              (out/target).write_bytes(raw)
              rows=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
              audit[target]={'original_public_source':url,'git_blob':blob,'sha256':hashlib.sha256(raw).hexdigest(),'rows':len(rows),'columns':list(rows[0]),'unique_error_labels':sorted({r.get('error_measure','') for r in rows})}
          (out/'source_audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(audit,indent=2))
          PY
          git archive --format=tar.gz HEAD > staging/iwe_source_checkout.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: iwe-diel-pinned-source-staging
          path: staging/
          if-no-files-found: error
          retention-days: 7
