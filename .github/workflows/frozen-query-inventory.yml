name: frozen-query-inventory

on:
  push:
    branches: ["research/tier-a-extraction-001"]
    paths:
      - ".github/workflows/frozen-query-inventory.yml"
      - "scripts/fetch_frozen_database_inventory.py"
      - "data/registry/frozen_database_queries.csv"

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch frozen database inventories
        run: |
          mkdir -p artifact/search
          python scripts/fetch_frozen_database_inventory.py             data/registry/frozen_database_queries.csv             --raw artifact/search/frozen_database_inventory_raw.csv             --unique artifact/search/frozen_database_inventory_unique.csv             --summary artifact/search/frozen_database_inventory_summary.json
      - name: Show inventory summary
        run: cat artifact/search/frozen_database_inventory_summary.json
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: frozen-query-inventory
          path: artifact/search
          if-no-files-found: error
