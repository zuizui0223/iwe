name: Diel direct-index and source-selection audit
on:
  workflow_dispatch:
  push:
    branches: [analysis/diel-index-selection-20261115]
    paths:
      - 'src/iwe/diel_index_selection.py'
      - 'scripts/run_diel_index_selection.py'
      - 'tests/test_diel_index_selection.py'
      - '.github/workflows/diel-index-selection.yml'
permissions:
  contents: read
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_diel_index_selection.py
      - name: Fetch original public source and validate exact Git blobs
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          sources=[('data/DvN_LiteratureDataClean_2024-09-13.csv','author.csv','39a82d966afcdde670603add1c881ace8791ffe9'),('data/SppTraitData_clean.csv','traits.csv','18381e550a7e405fe4f198909f0bb381bbecf1e0')]
          dest=Path('transient');dest.mkdir(exist_ok=True)
          for path,name,expected in sources:
              with urllib.request.urlopen('https://raw.githubusercontent.com/liamkendall/bumble-bat/main/'+path,timeout=45) as r:
                  raw=r.read(3000000)
              actual=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              if actual!=expected:raise ValueError('Original source changed: '+name)
              (dest/name).write_bytes(raw)
          PY
      - name: Rebuild aggregate results and independent numerical checks
        run: python scripts/run_diel_index_selection.py --author transient/author.csv --traits transient/traits.csv --out results/diel-index-selection
      - uses: actions/upload-artifact@v4
        with:
          name: iwe-diel-index-selection-20261115
          path: results/diel-index-selection/
          if-no-files-found: error
          retention-days: 90
