name: IWE Crone maple original masting stage tradeoff source screen

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/probe_crone2025_maple_source.py
      - tests/test_crone2025_maple_source.py
      - .github/workflows/crone2025-maple-original-source.yml

permissions:
  contents: read

jobs:
  original-masting-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tree/year vs partner-activity evidence boundaries
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_crone2025_maple_source.py
      - name: Source-only original tree flowering and seed records
        run: >-
          python -m scripts.probe_crone2025_maple_source
          --outdir /tmp/iwe-crone2025-original
      - name: Save source field and provenance inventory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crone2025-maple-original-fields
          path: /tmp/iwe-crone2025-original/source_original_file_fields.json
          if-no-files-found: warn
          retention-days: 7
