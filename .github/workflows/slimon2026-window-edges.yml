name: IWE Slimon source-confirmed window-edge exploratory test

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/analyze_slimon2026_window_edges.py
      - tests/test_slimon2026_window_edges.py
      - .github/workflows/slimon2026-window-edges.yml

permissions:
  contents: read

jobs:
  source-only-window-edges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original unit and no-promotion rules
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_slimon2026_window_edges.py
      - name: Explore original plant-specific early/late source variables
        run: python -m scripts.analyze_slimon2026_window_edges --outdir /tmp/iwe-slimon2026-window-edges
      - name: Save reviewed source summaries only, not raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slimon2026-window-edge-original-summary
          path: /tmp/iwe-slimon2026-window-edges/raw_window_edge_diagnostic.json
          if-no-files-found: warn
          retention-days: 7
