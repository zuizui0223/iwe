name: iwe011-package-audit

on:
  push:
    branches: ["research/tier-a-extraction-001"]
    paths:
      - ".github/workflows/iwe011-package-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact HUSCAP source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/iwe011/package
          url='https://eprints.lib.hokudai.ac.jp/repo/huscap/all/95572/Kudo%24Shibata_JEcol_Data.zip'
          code=$(curl -L --retry 2 --connect-timeout 20 --max-time 180 \
            -A "iwe-source-audit/1.0" \
            -w "%{http_code}" -o artifact/iwe011/data.zip "$url")
          bytes=$(wc -c < artifact/iwe011/data.zip | tr -d ' ')
          kind=$(file -b artifact/iwe011/data.zip)
          echo "http=$code bytes=$bytes kind=$kind" | tee artifact/iwe011/status.txt
          test "$code" = "200"
          unzip -q artifact/iwe011/data.zip -d artifact/iwe011/package
          find artifact/iwe011/package -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort | tee artifact/iwe011/files.txt

      - name: Inspect schemas without estimating IWE effect
        shell: bash
        run: |
          python - <<'PY' | tee artifact/iwe011/schema_audit.txt
          from pathlib import Path
          import csv, json

          root=Path("artifact/iwe011/package")
          for p in sorted(root.rglob("*.csv")):
              print("\n" + "="*80)
              print("FILE", p.relative_to(root), "bytes", p.stat().st_size)
              with p.open(newline="", encoding="utf-8-sig", errors="replace") as fh:
                  rows=list(csv.reader(fh))
              print("N_ROWS", max(0, len(rows)-1))
              print("COLUMNS", json.dumps(rows[0] if rows else [], ensure_ascii=False))
              for row in rows[1:11]:
                  print("ROW", json.dumps(row, ensure_ascii=False))
          PY

      - name: Upload package audit
        uses: actions/upload-artifact@v4
        with:
          name: iwe011-package-audit
          path: artifact/iwe011
          if-no-files-found: error
