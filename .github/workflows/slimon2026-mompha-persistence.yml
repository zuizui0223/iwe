name: IWE Slimon prior Mompha stage persistence and count signal

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/analyze_slimon2026_mompha_persistence.py
      - tests/test_slimon2026_mompha_persistence.py
      - tests/test_slimon2026_mompha_persistence_receipt.py
      - data/source_reconstructions/slimon2026_prior_mompha_persistence.csv
      - docs/SLIMON2026_PRIOR_MOMPHA_PERSISTENCE_20261011.md
      - .github/workflows/slimon2026-mompha-persistence.yml

permissions:
  contents: read

jobs:
  source-stage-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact seven-day previous-stage joins and source units
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_slimon2026_mompha_persistence.py tests/test_slimon2026_mompha_persistence_receipt.py
      - name: Analyze original previous insect detections and log counts
        run: >-
          python -m scripts.analyze_slimon2026_mompha_persistence
          --outdir /tmp/iwe-slimon2026-prior-mompha --boot 120
      - name: Save source-verified derived statistics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slimon2026-prior-mompha-persistence-summary
          path: /tmp/iwe-slimon2026-prior-mompha/original_mompha_prior_stage_control.json
          if-no-files-found: warn
          retention-days: 7
