name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Validate system registry
        run: python scripts/validate_registry.py data/registry/systems.csv
      - name: Check screening snapshot
        run: python scripts/render_screening_batch.py --check
      - name: Check evidence audit snapshot
        run: python scripts/render_evidence_audit_status.py --check
      - name: Check systematic search coverage
        run: python scripts/render_search_coverage_status.py --check
      - name: Check landscape pilot audit
        run: python scripts/render_landscape_pilot_audit.py --check
      - name: Check IWE001 directional landscape
        run: python scripts/build_iwe001_directional_landscape.py --check
      - name: Check IWE011 plot-rank landscape
        run: python scripts/build_iwe011_plot_rank_landscape.py --check
      - name: Check Kula phase-safety margin
        run: python scripts/build_kula2012_phase_margin.py --check
      - name: Check IWE032 effective cost window
        run: python scripts/build_iwe032_effective_cost_window.py --check
      - name: Check IWE032 effective fitness surface
        run: python scripts/build_iwe032_effective_fitness_surface.py --check
      - name: Check signed selection-shift pilot
        run: python scripts/render_selection_shift_pilot.py --check
      - name: Validate synthetic extraction
        run: python scripts/validate_extraction.py examples/synthetic_effects.csv
      - name: Validate direct extraction
        run: python scripts/validate_extraction.py data/extraction/direct_effects.csv
      - name: Validate registered dependence assignments
        run: python scripts/validate_dependencies.py
      - name: Validate strict H1 adjudications
        run: python scripts/validate_adjudications.py
      - name: Validate strict partner-window provenance
        run: python scripts/validate_window_provenance.py
      - name: Validate strict effect unit provenance
        run: python scripts/validate_unit_provenance.py
      - name: Validate replication candidate ledger
        run: python scripts/validate_replication_candidates.py
      - name: Validate replication completion routes
        run: python scripts/validate_replication_routes.py
      - name: Run Cardamine synthetic preflight
        run: >-
          python scripts/run_cardamine_preflight.py
          examples/cardamine_synthetic_plant_timing.csv
          examples/cardamine_synthetic_adult_events.csv
          examples/cardamine_synthetic_adult_provenance.json
          examples/cardamine_synthetic_outcomes.csv
          /tmp/iwe-cardamine-preflight
      - name: Build primary dataset
        run: python scripts/build_meta_dataset.py examples/synthetic_effects.csv /tmp/iwe-primary.csv
      - name: Run dependence-aware reference meta workflow
        run: python scripts/run_primary_meta.py examples/synthetic_effects.csv /tmp/iwe-meta
      - name: Run leave-one-dependence reference sensitivity
        run: python scripts/run_sensitivity.py examples/synthetic_effects.csv /tmp/iwe-meta/leave_one_dependence.csv
      - name: Build machine-readable claim status
        run: python scripts/build_claim_status.py examples/synthetic_effects.csv /tmp/iwe-meta/claim_status.json
      - name: Build real strict primary dataset
        run: python scripts/build_meta_dataset.py data/extraction/direct_effects.csv /tmp/iwe-real-primary.csv
      - name: Run real dependence-aware reference meta workflow
        run: python scripts/run_primary_meta.py data/extraction/direct_effects.csv /tmp/iwe-real-meta
      - name: Run real leave-one-dependence reference sensitivity
        run: python scripts/run_sensitivity.py data/extraction/direct_effects.csv /tmp/iwe-real-meta/leave_one_dependence.csv
      - name: Build real machine-readable claim status
        run: python scripts/build_claim_status.py data/extraction/direct_effects.csv /tmp/iwe-real-meta/claim_status.json
