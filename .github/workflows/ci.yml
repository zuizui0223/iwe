name: ci

on:
  push:
    branches: [main, "feat/**", "research/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Reconstruct IWE068 pinned raw-data effect
        run: python scripts/reconstruct_iwe068.py --json /tmp/iwe068.json --plants /tmp/iwe068-plants.csv
      - name: Verify IWE068 registered effect matches pinned reconstruction
        run: |
          python - <<'PY'
          import json
          import math
          import pandas as pd

          result = json.load(open('/tmp/iwe068.json', encoding='utf-8'))
          effects = pd.read_csv('data/extraction/direct_effects.csv')
          row = effects.loc[effects['effect_id'] == 'IWE068_MAXFIELD_FZ']
          assert len(row) == 1, 'expected exactly one IWE068 direct-effect row'
          row = row.iloc[0]
          assert int(row['sample_size']) == int(result['n'])
          assert math.isclose(float(row['effect_native']), float(result['fisher_z_native']), rel_tol=0, abs_tol=1e-12)
          assert math.isclose(float(row['variance_native']), float(result['variance_native']), rel_tol=0, abs_tol=1e-12)
          print('OK: IWE068 registered row exactly matches pinned raw-data reconstruction.')
          PY
      - name: Reconstruct IWE084 published SMD effect
        run: python scripts/reconstruct_iwe084.py --json /tmp/iwe084.json
      - name: Verify IWE084 registered effect matches frozen reconstruction
        run: |
          python - <<'PY'
          import json
          import math
          import pandas as pd

          result = json.load(open('/tmp/iwe084.json', encoding='utf-8'))
          effects = pd.read_csv('data/extraction/direct_effects.csv')
          row = effects.loc[effects['effect_id'] == 'IWE084_SGRAM_APIS_SMD']
          assert len(row) == 1, 'expected exactly one IWE084 direct-effect row'
          row = row.iloc[0]
          assert row['effect_family'] == 'standardized_mean_difference'
          assert int(row['sample_size']) == int(result['sample_size'])
          assert math.isclose(float(row['effect_native']), float(result['hedges_g']), rel_tol=0, abs_tol=1e-12)
          assert math.isclose(float(row['variance_native']), float(result['variance_native']), rel_tol=0, abs_tol=1e-12)
          print('OK: IWE084 registered row exactly matches frozen published-table reconstruction.')
          PY
      - name: Validate system registry
        run: python scripts/validate_registry.py data/registry/systems.csv
      - name: Validate study screening registry
        run: python scripts/validate_studies.py data/registry/studies.csv
      - name: Parse-check all registry CSV files
        run: python scripts/validate_registry_csvs.py data/registry
      - name: Validate synthetic extraction
        run: python scripts/validate_extraction.py examples/synthetic_effects.csv
      - name: Validate direct extraction
        run: python scripts/validate_extraction.py data/extraction/direct_effects.csv
      - name: Build common-scale feasibility gate
        run: python scripts/build_common_scale_gate.py data/extraction/common_scale_fisher_z.csv /tmp/iwe-common-scale-gate.json
      - name: Build primary dataset
        run: python scripts/build_meta_dataset.py examples/synthetic_effects.csv /tmp/iwe-primary.csv
      - name: Run reference meta workflow
        run: python scripts/run_primary_meta.py examples/synthetic_effects.csv /tmp/iwe-meta
      - name: Run leave-one-study reference sensitivity
        run: python scripts/run_sensitivity.py examples/synthetic_effects.csv /tmp/iwe-meta/leave_one_study.csv
      - name: Build machine-readable claim status from biological corpus
        run: python scripts/build_claim_status.py data/extraction/direct_effects.csv /tmp/iwe-meta/claim_status.json
      - name: Verify H1 claim status obeys common-scale gate
        run: |
          python - <<'PY'
          import json

          status = json.load(open('/tmp/iwe-meta/claim_status.json', encoding='utf-8'))
          h1 = status['H1']
          assert status['schema'] == 'iwe_claim_status_v2'
          assert h1['status'] == 'not_evaluable'
          assert h1['common_scale_gate_status'] == 'coverage_only'
          assert h1['programme_counts'] == {
              'antagonist': 1,
              'mixed_pollinating_seed_predator': 1,
              'mutualist': 1,
          }
          assert h1['cross_class_fit_allowed'] is False
          assert h1['primary_claim_gate'] is False
          print('OK: biological claim status is locked to coverage_only.')
          PY

      - name: Build current evidence architecture
        run: python scripts/build_evidence_architecture.py --output /tmp/iwe-evidence-architecture.csv
      - name: Verify evidence architecture preserves primary gate counts
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('/tmp/iwe-evidence-architecture.csv').set_index('interaction_type')
          assert int(df.loc['mutualist', 'strict_quantitative_programmes_closed']) == 3
          assert int(df.loc['antagonist', 'strict_quantitative_programmes_closed']) == 1
          assert int(df.loc['mixed_pollinating_seed_predator', 'strict_quantitative_programmes_closed']) == 1
          assert int(df.loc['mutualist', 'common_scale_fisher_z_programmes_closed']) == 1
          assert int(df.loc['antagonist', 'common_scale_fisher_z_programmes_closed']) == 1
          assert int(df.loc['mixed_pollinating_seed_predator', 'common_scale_fisher_z_programmes_closed']) == 1
          print(df.to_string())
          PY
      - name: Build strict-evidence blocker queue
        run: python scripts/build_strict_blocker_queue.py data/registry/strict_blockers.csv /tmp/iwe-strict-blockers.csv
      - name: Verify blocker queue prioritizes gate-changing programmes
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('/tmp/iwe-strict-blockers.csv')
          top = df.loc[
              (df['priority'] == 1)
              & (df['primary_gate_gain_if_closed'] == 1)
              & (df['source_eligible'].astype(str).str.lower() == 'true')
          ]
          required = {'IWE035', 'IWE059', 'IWE067', 'IWE086'}
          assert required.issubset(set(top['study_id']))
          assert (top['gate_value'] == top['gate_value'].max()).all()
          print(top[
              ['study_id','interaction_type','blocker_type','next_action']
          ].to_string(index=False))
          PY
      - name: Build current strict-blocker family summary
        run: python scripts/build_strict_blocker_summary.py data/registry/strict_blockers.csv /tmp/iwe-strict-blocker-summary.csv
      - name: Verify blocker-family summary
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('/tmp/iwe-strict-blocker-summary.csv')
          total = df.groupby('interaction_type')['n_open_blockers'].sum().to_dict()
          assert total == {
              'antagonist': 7,
              'mixed_pollinating_seed_predator': 3,
              'mutualist': 8,
          }
          def n(cls, family):
              row = df.loc[
                  (df['interaction_type'] == cls)
                  & (df['blocker_family'] == family),
                  'n_open_blockers',
              ]
              return 0 if row.empty else int(row.iloc[0])
          assert n('antagonist', 'access') == 3
          assert n('antagonist', 'uncertainty') == 3
          assert n('mutualist', 'uncertainty') == 2
          assert n('mutualist', 'dependence') == 2
          assert n('mixed_pollinating_seed_predator', 'access') == 1
          print(df.to_string(index=False))
          PY
      - name: Validate systematic-search completion gate
        run: python scripts/check_search_completion.py data/registry/search_completion_status.csv /tmp/iwe-search-completion.json
      - name: Verify search is not prematurely declared closed
        run: |
          python - <<'PY'
          import json
          status = json.load(open('/tmp/iwe-search-completion.json', encoding='utf-8'))
          assert status['schema'] == 'iwe_search_completion_v1'
          assert status['search_closed'] is False
          assert set(status['remaining_components']) == {'A','B','C','D','E','F'}
          print(status)
          PY
