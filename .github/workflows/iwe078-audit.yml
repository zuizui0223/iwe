name: iwe078-audit

on:
  push:
    branches: ["research/tier-a-extraction-001"]
    paths:
      - ".github/workflows/iwe078-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download and audit exact overlap definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iwe078
          curl -L --retry 2 --connect-timeout 20 --max-time 120 \
            -A "iwe-literature-audit/1.0" \
            "https://zenodo.org/api/records/19488509" -o /tmp/iwe078/record.json
          zip_url=$(python - <<'PY'
          import json
          data=json.load(open("/tmp/iwe078/record.json"))
          for f in data["files"]:
              if f["key"] == "Freese Stats.zip":
                  print(f["links"].get("content") or f["links"].get("self"))
                  break
          PY
          )
          curl -L --retry 2 --max-time 180 -A "iwe-literature-audit/1.0" "$zip_url" -o /tmp/iwe078/data.zip
          unzip -q /tmp/iwe078/data.zip -d /tmp/iwe078/u
          cd "/tmp/iwe078/u/Freese Stats"

          echo "===== exp1_time_series source construction ====="
          nl -ba exp1_time_series.R | sed -n '1,335p'
          echo "===== exp1_pubver cleaning + fitness + SEM ====="
          nl -ba exp1_pubver.R | sed -n '35,135p;260,370p'
          echo "===== exp2_time_series source construction ====="
          nl -ba exp2_time_series.R | sed -n '1,330p'
          echo "===== exp2_pubver cleaning + fitness + SEM ====="
          nl -ba exp2_pubver.R | sed -n '35,145p;235,330p'

          echo "===== Source treatment and Mompha-acquisition audit ====="
          python - <<'PY'
          import csv
          from collections import Counter

          def rows(name):
              with open(name, newline="", encoding="utf-8-sig") as fh:
                  return list(csv.DictReader(fh))

          for name, field in [("main_exp1.csv","TRT"),("main_exp2.csv","Treatment")]:
              rr=rows(name)
              print(name, "treatments", Counter(r.get(field,"") for r in rr))

          for name, corr in [
              ("momphaCALC_exp1.csv","Pos GainedOLD+lostNEW"),
              ("momphaCALC_exp2.csv","pos gin lost"),
          ]:
              rr=rows(name)
              print("\n",name,"nonzero/observed acquisition examples")
              shown=0
              for r in rr:
                  mg=r.get("mompha gained","")
                  cr=r.get(corr,"")
                  mo=r.get("mompha","")
                  if mg not in ("","NA","na") or cr not in ("","NA","na"):
                      try:
                          value=(0 if mg in ("","NA","na") else float(mg)) + (0 if cr in ("","NA","na") else float(cr))
                      except ValueError:
                          continue
                      if value > 0 or shown < 3:
                          print({k:r.get(k) for k in ["ID","TRT","geno","date","mompha","OLDmompha","mompha gained",corr,"TOTAL_Mompha"]})
                          shown += 1
                          if shown >= 16:
                              break
          PY

          echo "===== Mompha weekly event-field audit ====="
          python - <<'PY'
          import csv
          def rows(name):
              with open(name, newline="", encoding="utf-8-sig") as fh:
                  return list(csv.DictReader(fh))
          for name, plant, corr in [
              ("momphaCALC_exp1.csv","64.55","Pos GainedOLD+lostNEW"),
              ("momphaCALC_exp2.csv","10.06","pos gin lost"),
          ]:
              print("\nFILE",name,"PLANT",plant)
              for r in rows(name):
                  if r.get("ID") == plant:
                      print({k:r.get(k) for k in [
                          "date","mompha","OLDmompha","increase in mompha","positive mompha",
                          "negatove mompha","increase old","positive old","mompha lost",
                          "old mompha gained","GainedOLD+lostNEW",corr,"mompha gained","TOTAL_Mompha"
                      ]})
          PY

          echo "===== README relevant text ====="
          grep -niE "overlap|Mompha|Schinia|seed pred|fitness|flower" READ_ME_Phenological_plasticity.txt | head -n 300 || true

          echo "===== CSV structures ====="
          python - <<'PY'
          import csv
          for name in [
              "fflr_overlap_ex1.csv","comp_final_sum_exp1.csv","fitness_exp1.csv","main_exp1.csv",
              "fflr_overlap_ex2.csv","comp_final_sum_exp2.csv","Exp 2 fitness.csv","main_exp2.csv",
              "momphaCALC_exp1.csv","momphaCALC_exp2.csv","df2_exp1F.csv","df2_exp2F.csv",
          ]:
              print("\nFILE", name)
              with open(name, newline="", encoding="utf-8-sig") as fh:
                  rows = list(csv.reader(fh))
              print("rows", max(0, len(rows)-1))
              print("cols", rows[0] if rows else [])
              for row in rows[1:4]:
                  print(row)
          PY
