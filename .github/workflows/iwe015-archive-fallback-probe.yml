name: IWE015 independent published dataset ZIP probe

on:
  pull_request:
    types: [opened]
    paths:
      - scripts/probe_iwe015_dataset_zip.py
      - tests/test_iwe015_dataset_archive_probe.py
      - .github/workflows/iwe015-archive-fallback-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and check non-network ZIP provenance
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_iwe015_dataset_archive_probe.py
      - name: Try documented public whole-dataset archive endpoint
        id: raw_archive
        continue-on-error: true
        env:
          DRYAD_ACCESS_TOKEN: ${{ secrets.DRYAD_ACCESS_TOKEN }}
        run: >-
          python -m scripts.probe_iwe015_dataset_zip
          --output-dir /tmp/iwe015-whole-archive
          --strict
          --timeout 20
      - name: Declare archive access status, not science result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/iwe015-whole-archive/archive_manifest.json')
          if not p.exists():
              print('::warning::Archive probe produced no manifest')
          else:
              x = json.loads(p.read_text())
              print(f"ARCHIVE={x['status']} PINNED_FILES={x['n_matched']}/{x['n_expected']}")
              print(f"Reason={x.get('error', 'none')}")
              if x['status'] != 'complete':
                  print('::warning::Whole dataset download blocked or partial; no biological evidence recovered.')
          print('Hedges g and strict H1 remain unmodified.')
          PY
      - name: Upload access report only unless source complete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwe015-full-dataset-zip-probe
          path: /tmp/iwe015-whole-archive/
          if-no-files-found: warn
          retention-days: 7
