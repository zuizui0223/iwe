name: frozen-source-type-audit

on:
  push:
    branches: ["research/tier-a-extraction-001"]
    paths:
      - ".github/workflows/frozen-source-type-audit.yml"
      - "src/iwe/screening_triage.py"
      - "scripts/audit_unscreened_source_types.py"
      - "data/registry/frozen_database_screening_ledger.csv"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build source-type audit
        run: python scripts/audit_unscreened_source_types.py
      - name: Persist source-type audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/derived/frozen_screening_source_type_audit_current.csv             data/derived/frozen_screening_source_type_queue_current.csv             data/derived/frozen_screening_source_type_summary_current.json
          if git diff --cached --quiet; then
            echo "Source-type audit already matches repository."
          else
            git commit -m "research: freeze screening source-type audit"
            git pull --rebase origin research/tier-a-extraction-001
            git push origin HEAD:research/tier-a-extraction-001
          fi
      - name: Upload source-type audit
        uses: actions/upload-artifact@v4
        with:
          name: frozen-source-type-audit
          path: |
            data/derived/frozen_screening_source_type_audit_current.csv
            data/derived/frozen_screening_source_type_queue_current.csv
            data/derived/frozen_screening_source_type_summary_current.json
          if-no-files-found: error
