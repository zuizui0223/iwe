name: Cardamine publisher source-timing asset audit

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/probe_cardamine_public_timing_assets.py
      - tests/test_cardamine_public_timing_asset_probe.py
      - .github/workflows/cardamine-publisher-asset-probe.yml

permissions:
  contents: read

jobs:
  one-time-public-asset-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test byte-level source verification
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_cardamine_public_timing_asset_probe.py
      - name: Download four source-linked official publisher assets (non-promoting)
        run: >-
          python -m scripts.probe_cardamine_public_timing_assets
          --outdir /tmp/cardamine-publisher-asset-probe
          --timeout 15
      - name: Report access and hold strict timing gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/cardamine-publisher-asset-probe/manifest.json')
          if not p.exists():
              print('::warning::No publisher asset manifest; nothing can be promoted')
          else:
              d = json.loads(p.read_text())
              print(f"Publisher assets fetched: {d['downloaded_assets']}/{d['expected_assets']}")
              for f in d['source_files']:
                  print(f"{f['filename']}: {f['access_status']} {f.get('error','')}")
              if d['downloaded_assets'] == 0:
                  print('::warning::All pinned publisher assets blocked; no adult flight values recovered')
          print('Even a successful binary download is NOT a numerical adult flight datum.')
          PY
      - name: Save unreviewed publisher-source assets for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardamine-publisher-timing-source-unreviewed
          path: /tmp/cardamine-publisher-asset-probe/
          if-no-files-found: warn
          retention-days: 7
