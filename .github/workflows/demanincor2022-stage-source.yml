name: IWE 2022 warming synchrony-versus-reproduction source gate

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - scripts/probe_demanincor2022_stage_zip.py
      - tests/test_demanincor2022_stage_zip.py
      - scripts/audit_demanincor2022_reproduction_units.py
      - tests/test_demanincor2022_reproduction_units.py
      - scripts/analyze_demanincor2022_grouped_stage_windows.py
      - tests/test_demanincor2022_grouped_stage_windows.py
      - .github/workflows/demanincor2022-stage-source.yml
      - docs/DEMANINCOR2022_REPRODUCTIVE_STAGE_SOURCE_GATE.md

permissions:
  contents: read

jobs:
  source-profile-without-false-fitness-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source schema logic and original-byte mismatch protections
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_demanincor2022_stage_zip.py tests/test_demanincor2022_reproduction_units.py tests/test_demanincor2022_grouped_stage_windows.py
      - name: Retrieve author-deposited ZIP and code with exact MD5 from original record
        run: >-
          python -m scripts.probe_demanincor2022_stage_zip
          --outdir /tmp/iwe-demanincor2022-original
      - name: Quantify true unit of six-seed germination and seedling survival
        run: >-
          python -m scripts.audit_demanincor2022_reproduction_units
          --outdir /tmp/iwe-demanincor2022-original
      - name: Model 60 legitimate reproductive groups across 20 arena holdouts, never 208 independent F1 trials
        run: >-
          python -m scripts.analyze_demanincor2022_grouped_stage_windows
          --outdir /tmp/iwe-demanincor2022-original
      - name: Share aggregated source-unit audits only, no biological raw source redistribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwe-2022-plant-bee-fitness-source-inventory
          path: |
            /tmp/iwe-demanincor2022-original/source_archive_profile.json
            /tmp/iwe-demanincor2022-original/same_unit_quality_gate.json
            /tmp/iwe-demanincor2022-original/grouped_stage_prediction_audit.json
          if-no-files-found: warn
          retention-days: 7
